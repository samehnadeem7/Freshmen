 {id:"ighfir",name:"Between the two prostrations",when:"Sitting between the sajdatayn · wājib",ar:"رَبِّ اغْفِرْ لِی",tr:"Rabbi-ghfir lī",en:"My Lord, forgive me."},
 {id:"tashahhud",name:"The complete tashahhud",when:"Last sitting of every prayer (and the first sitting in prayers of three or four rakʿāt)",ar:"اَلتَّحِيَّاتُ لِلّٰهِ وَالصَّلَوَاتُ وَالطَّيِّبَاتُ، اَلسَّلَامُ عَلَيْكَ اَيُّهَا النَّبِیُّ وَرَحْمَةُ اللّٰهِ وَبَرَكَاتُهٗ، اَلسَّلَامُ عَلَيْنَا وَعَلٰى عِبَادِ اللّٰهِ الصَّالِحِيْنَ، اَشْهَدُ اَنْ لَّا اِلٰهَ اِلَّا اللّٰهُ وَاَشْهَدُ اَنَّ مُحَمَّدًا عَبْدُهٗ وَرَسُوْلُهٗ",tr:"At-taḥiyyātu lillāhi waṣ-ṣalawātu waṭ-ṭayyibāt. As-salāmu ʿalayka ayyuhan-nabiyyu wa raḥmatullāhi wa barakātuh. As-salāmu ʿalaynā wa ʿalā ʿibādillāhiṣ-ṣāliḥīn. Ash-hadu an lā ilāha illallāh, wa ash-hadu anna Muḥammadan ʿabduhu wa rasūluh.",en:"All greetings, prayers and good words are for Allah. Peace be upon you, O Prophet, and the mercy of Allah and His blessings. Peace be upon us and upon the righteous servants of Allah. I bear witness that there is no god but Allah, and I bear witness that Muhammad is His servant and messenger."},
 {id:"tashmin",name:"The tashahhud · minimum",when:"The least that fulfils the obligation",ar:"اَلتَّحِيَّاتُ لِلّٰهِ، سَلَامٌ عَلَيْكَ اَيُّهَا النَّبِیُّ وَرَحْمَةُ اللّٰهِ، سَلَامٌ عَلَيْنَا وَعَلٰى عِبَادِ اللّٰهِ الصَّالِحِيْنَ، اَشْهَدُ اَنْ لَّا اِلٰهَ اِلَّا اللّٰهُ وَاَنَّ مُحَمَّدًا رَّسُوْلُ اللّٰهِ",tr:"At-taḥiyyātu lillāh. Salāmun ʿalayka ayyuhan-nabiyyu wa raḥmatullāh. Salāmun ʿalaynā wa ʿalā ʿibādillāhiṣ-ṣāliḥīn. Ash-hadu an lā ilāha illallāh wa anna Muḥammadan rasūlullāh.",en:"The same testimony in its shortest valid form. The document also allows “ʿabduhu wa rasūluh” at the end."},
 {id:"salawat",name:"Salawāt upon the Prophet ﷺ",when:"After the last tashahhud · rukn",ar:"اَللّٰهُمَّ صَلِّ عَلٰى مُحَمَّدٍ وَّعَلٰى اٰلِ مُحَمَّدٍ، كَمَا صَلَّيْتَ عَلٰى اِبْرَاهِيْمَ وَعَلٰى اٰلِ اِبْرَاهِيْمَ اِنَّكَ حَمِيْدٌ مَّجِيْدٌ، وَبَارِكْ عَلٰى مُحَمَّدٍ وَّعَلٰى اٰلِ مُحَمَّدٍ، كَمَا بَارَكْتَ عَلٰى اِبْرَاهِيْمَ وَعَلٰى اٰلِ اِبْرَاهِيْمَ اِنَّكَ حَمِيْدٌ مَّجِيْدٌ",tr:"Allāhumma ṣalli ʿalā Muḥammad wa ʿalā āli Muḥammad, kamā ṣallayta ʿalā āli Ibrāhīm innaka Ḥamīdun Majīd. Wa bārik ʿalā Muḥammad wa ʿalā āli Muḥammad, kamā bārakta ʿalā āli Ibrāhīm innaka Ḥamīdun Majīd.",en:"O Allah, send prayers upon Muhammad and the family of Muhammad, as You sent prayers upon the family of Ibrahim; You are Praiseworthy and Glorious. And bless Muhammad and the family of Muhammad, as You blessed the family of Ibrahim; You are Praiseworthy and Glorious."},
 {id:"salmin",name:"Salawāt · minimum",when:"The least that fulfils the obligation",ar:"اَللّٰهُمَّ صَلِّ عَلٰى مُحَمَّدٍ",tr:"Allāhumma ṣalli ʿalā Muḥammad",en:"O Allah, send prayers upon Muhammad."},
 {id:"dua",name:"Duʿāʾ before the taslīm",when:"Recommended, after the salawāt",ar:"اَعُوْذُ بِاللّٰهِ مِنْ عَذَابِ جَهَنَّمَ وَمِنْ عَذَابِ الْقَبْرِ وَمِنْ فِتْنَةِ الْمَحْيَا وَالْمَمَاتِ وَمِنْ فِتْنَةِ الْمَسِيْحِ الدَّجَّالِ، اَللّٰهُمَّ اِنِّیْ اَعُوْذُ بِكَ مِنَ الْمَاْثَمِ وَالْمَغْرَمِ",tr:"Aʿūdhu billāhi min ʿadhābi jahannam, wa min ʿadhābil-qabr, wa min fitnatil-maḥyā wal-mamāt, wa min fitnatil-Masīḥid-Dajjāl. Allāhumma innī aʿūdhu bika minal-maʾthami wal-maghram.",en:"I seek refuge in Allah from the punishment of Hell, from the punishment of the grave, from the trials of life and death, and from the trial of the False Messiah. O Allah, I seek refuge in You from sin and debt."},
 {id:"taslim",name:"The taslīm",when:"Said twice, right then left · rukn",ar:"اَلسَّلَامُ عَلَيْكُمْ وَرَحْمَةُ اللّٰهِ",tr:"As-salāmu ʿalaykum wa raḥmatullāh",en:"Peace be upon you and the mercy of Allah."},
 {id:"istighfar",name:"First dhikr after Salah",when:"Three times",ar:"اَسْتَغْفِرُ اللّٰهَ",tr:"Astaghfirullāh",en:"I seek forgiveness from Allah."},
 {id:"antas",name:"Second dhikr after Salah",when:"After the istighfār",ar:"اَللّٰهُمَّ اَنْتَ السَّلَامُ وَمِنْكَ السَّلَامُ تَبَارَكْتَ يَا ذَا الْجَلَالِ وَالْاِكْرَامِ",tr:"Allāhumma antas-salāmu wa minkas-salām, tabārakta yā dhal-jalāli wal-ikrām.",en:"O Allah, You are Peace and from You is peace; blessed are You, O Possessor of Majesty and Honour."},
 {id:"tasbih",name:"The thirty-three",when:"Grouped together, thirty-three times each",ar:"سُبْحَانَ اللّٰهِ وَالْحَمْدُ لِلّٰهِ وَاللّٰهُ اَكْبَرُ",tr:"Subḥānallāh, walḥamdulillāh, wallāhu akbar",en:"Glory be to Allah, praise be to Allah, Allah is the Greatest."},
 {id:"tahlil",name:"The closing tahlīl",when:"After the thirty-three counts",ar:"لَا اِلٰهَ اِلَّا اللّٰهُ وَحْدَهٗ لَا شَرِيْكَ لَهٗ، لَهُ الْمُلْكُ وَلَهُ الْحَمْدُ وَهُوَ عَلٰى كُلِّ شَيْءٍ قَدِيْرٌ",tr:"Lā ilāha illallāhu waḥdahū lā sharīka lah, lahul-mulku wa lahul-ḥamd, wa huwa ʿalā kulli shayʾin qadīr.",en:"None has the right to be worshipped but Allah alone, without partner. His is the dominion and His is the praise, and He has power over all things."}
];

/* ---------- learn steps ---------- */
function say(r){return '<div class="say"><div class="lbl">'+r.name+'</div><span class="ar big" lang="ar" dir="rtl">'+r.ar+'</span><div class="tr">'+r.tr+'</div><div class="en">'+r.en+'</div></div>'}
function rec(id){return RECS.filter(function(r){return r.id===id})[0]}
function ul(a){return '<ul>'+a.map(function(x){return '<li>'+x+'</li>'}).join('')+'</ul>'}
var STEPS=[
 {id:"s1",t:"Be ready: the nine conditions",tag:"Shart",cls:"",body:ul(["Salah is valid from the age of seven but not obligatory until puberty.","Nine shurūṭ must be met: "+SHART.join("; ")+".","ʿAwrah in Salah: for a man above 10, and a girl from 7 until puberty, it is between the navel and knees. A woman after puberty covers her whole body including hands and feet, except her face. A boy from 7 to 10 covers the front and back private parts.","A man must also cover at least one of his shoulders in obligatory prayers."])},
 {id:"s2",t:"Stand and begin with the takbīr",tag:"Rukn",cls:"rukn",body:ul(["Qiyām (standing) is a rukn in obligatory prayers.","Takbīratul iḥrām is a rukn. It is the first takbīr; every later takbīr is only wājib."])},
 {id:"s3",t:"Recite Surah al-Fātiḥa",tag:"Rukn",cls:"rukn",body:ul(["A rukn for everyone except the maʾmūm (the one following the Imam).","Repeating al-Fātiḥa is disliked, unless necessary, for example if it was read incorrectly the first time."])},
 {id:"s4",t:"Bow in rukūʿ",tag:"Rukn",cls:"rukn",body:ul(["Rukūʿ is a rukn.","The tasbīḥ in rukūʿ is wājib, and so is the takbīr you say moving into it.","Al-tamaʾnīnah (stillness for at least a moment) is a rukn in every movement."])},
 {id:"s5",t:"Rise from rukūʿ",tag:"Rukn",cls:"rukn",body:ul(["Rising from rukūʿ is a rukn.","The tasmīʿ is wājib for everyone except the maʾmūm, and the tahmīd is wājib."])+say(rec("tasmi"))+say(rec("tahmid"))},
 {id:"s6",t:"Go down into sujūd",tag:"Rukn",cls:"rukn",body:ul(["Sujūd and rising from sujūd are both arkān.","The tasbīḥ in sujūd is wājib.","Putting the forearms on the ground in sujūd is disliked."])},
 {id:"s7",t:"Sit between the two prostrations",tag:"Rukn",cls:"rukn",body:ul(["The sitting between the sajdatayn is a rukn.","Saying “Rabbi-ghfir lī” is wājib. Then the second sujūd follows."])+say(rec("ighfir"))},
 {id:"s8",t:"The first tashahhud and standing for the next rakʿah",tag:"Wajib",cls:"wajib",body:ul(["In a prayer of three or four rakʿāt there are two tashahhuds. The first tashahhud and the sitting for it are wājib.","You then get up for the next rakʿah saying Allāhu akbar. It is not recommended to raise your hands here.","If a prayer has only one tashahhud, that tashahhud is a rukn.","Witr prayed as three rakʿāt in one go has a single tashahhud at the end. Sitting in the second rakʿah as in Maghrib is disliked."])},
 {id:"s9",t:"The last tashahhud",tag:"Rukn",cls:"rukn",body:ul(["The last tashahhud and sitting for it are arkān.","It is recommended to sit in tawarruk: left foot out on the right side, sit on the floor, right foot upright with its toes towards the Qiblah."])+say(rec("tashahhud"))+say(rec("tashmin"))},
 {id:"s10",t:"Send salawāt upon the Prophet ﷺ",tag:"Rukn",cls:"rukn",body:ul(["After the last tashahhud this is a rukn. Say it in the second part of the last rakʿah, whichever rakʿah that is.","One may also say "+AR("عَلٰى اِبْرَاهِيْمَ وَعَلٰى اٰلِ اِبْرَاهِيْمَ")+" instead of “on the family of Ibrahim”, though the full version is preferred."])+say(rec("salawat"))+say(rec("salmin"))},
 {id:"s11",t:"Make duʿāʾ",tag:"Sunnah",cls:"",body:ul(["It is recommended to say this duʿāʾ after the salawāt.","After it you may make any other duʿāʾ you wish, and likewise in sujūd.","Duʿāʾ for worldly enjoyments, such as a beautiful wife, a big house or a high-paying salary, invalidates the prayer. Asking for general blessings such as halāl provisions and good health is permissible."])+say(rec("dua"))},
 {id:"s12",t:"Finish with the taslīm",tag:"Rukn",cls:"rukn",body:ul(["Two taslīms are a rukn in an obligatory prayer. In a nafl prayer one is the rukn and the second is recommended.","Dropping, changing or adding a letter invalidates it. Adding “wa barakātuh” is permissible, though leaving it off is better.","You must be sitting. Turn to the right first, then the left, and turn further to the left."])+say(rec("taslim"))},
 {id:"s13",t:"After Salah: the adhkār",tag:"Sunnah",cls:"",body:ul(["Istighfār three times, then “Allāhumma antas-salām…”.","The Imam turns to face the congregation, unless women are present, in which case he waits for them to leave.","Then the thirty-three of each, counted with the fingers of the right hand, then the tahlīl.","Finally Surah al-Ikhlās, al-Falaq, an-Nās and Āyatul Kursī, once each. The document notes there are other recommended adhkār it left out."])+say(rec("istighfar"))+say(rec("antas"))+say(rec("tasbih"))+say(rec("tahlil"))},
 {id:"s14",t:"Notes on a woman’s prayer",tag:"Note",cls:"",body:ul(["It is exactly like a man’s, except that she does not spread out her limbs in sujūd.","When sitting she puts both feet to the right side and sits on the ground (the preferred method), or sits cross-legged."])}
];

/* ---------- question pool ---------- */
var POOL=[];
function add(q){POOL.push(q)}
var CATS=["Condition (shart)","Pillar (rukn)","Obligation (wājib)","Recommended (sunnah)","Disliked (makrūh)","Invalidates the Salah"];
[[SHART,0],[ARKAN,1],[WAJIB,2],[SUNNAH,3],[MAKRUH,4],[INVALID,5]].forEach(function(p){
  p[0].forEach(function(t,i){
    if(t==="Leaning on something")return;
    add({key:"c"+p[1]+"."+i,kind:"rulings",type:"mcq",fixed:true,q:"What is this in Salah?<span class=\"subject\">"+t+"</span>",opts:CATS,a:p[1],why:"It is classed as: "+CATS[p[1]]+"."});
  });
});
function fact(key,q,right,wrong,why){add({key:"f"+key,kind:"facts",type:"mcq",q:q,opts:[right].concat(wrong),a:0,why:why})}
fact(1,"How many conditions (shurūṭ) must be met for a valid Salah?","9",["7","8","10","12"],"There are nine shurūṭ.");
fact(2,"How many arkān (pillars) does Salah have?","14",["8","9","12","16"],"There are fourteen arkān.");
fact(3,"How many wājibāt (obligations) does Salah have?","8",["5","7","9","14"],"There are eight wājibāt. Everything else is sunnah.");
fact(4,"From what age is Salah valid, though not yet obligatory?","Seven",["Five","Ten","Twelve","Fifteen"],"Salah is valid from seven but not obligatory until puberty.");
fact(5,"What is the ʿawrah in Salah for a man above the age of 10?","Between the navel and the knees",["Shoulders to knees","Only the private parts","Chest to ankles"],"Navel to knees. In obligatory prayers he must also cover at least one shoulder.");
fact(6,"What is the ʿawrah in Salah for a boy from 7 to 10?","The front and back private parts",["Navel to knees","Shoulders to knees","The whole body"],"For a male aged 7 to 10 it is the front and back private parts.");
fact(7,"What is the ʿawrah in Salah for a girl from age 7 until puberty?","Between the navel and the knees",["Her whole body except the face","The front and back private parts","Only her hair"],"A female from 7 until puberty has the same ʿawrah as a man above 10: navel to knees.");
fact(8,"What must a woman after puberty cover in Salah?","Her whole body including hands and feet, except her face",["Navel to knees","Everything except hands and feet","Only her hair and neck"],"Her whole body, including hands and feet, except for her face.");
fact(9,"What is extra for a man’s covering in obligatory prayers?","He must cover at least one shoulder",["He must cover his head","He must cover both arms","Nothing extra"],"It is a condition that a man covers at least one shoulder in obligatory prayers.");
fact(10,"If a prayer has only one tashahhud, what is its status?","A rukn",["Wājib","Sunnah","Disliked"],"A prayer with only one tashahhud: that tashahhud is a rukn.");
fact(11,"In a prayer of three or four rakʿāt, what is the status of the first tashahhud?","Wājib",["Rukn","Sunnah","Makrūh"],"The first is wājib. The second, in the last rakʿah, is a rukn.");
fact(12,"In a prayer of three or four rakʿāt, what is the status of the second (last) tashahhud?","Rukn",["Wājib","Sunnah","Makrūh"],"The last tashahhud is a rukn.");
fact(13,"Witr is prayed as three rakʿāt in one go. How many tashahhuds are there?","One, at the end",["Two","None","One, after the first rakʿah"],"There is one tashahhud at the end. Praying it like Maghrib, sitting in the second rakʿah, is makrūh.");
fact(14,"What do you say when getting up for the next rakʿah after the first tashahhud?","Allāhu akbar, without raising your hands",["Allāhu akbar, raising your hands","Nothing at all","Subḥānallāh"],"You get up saying Allāhu akbar. Raising the hands here is not recommended.");
fact(15,"Which describes sitting in tawarruk?","Left foot out on the right side, sit on the floor, right foot upright with toes to the Qiblah",["Sit on both heels with feet together","Sit cross-legged","Both feet out to the left, sit on the floor"],"That is the form of al-tawarruk, recommended in the last tashahhud.");
fact(16,"What is the minimum salawāt that fulfils the obligation?",AR("اَللّٰهُمَّ صَلِّ عَلٰى مُحَمَّدٍ"),[AR("وَبَارِكْ عَلٰى مُحَمَّدٍ"),AR("كَمَا صَلَّيْتَ عَلٰى اٰلِ اِبْرَاهِيْمَ"),AR("اِنَّكَ حَمِيْدٌ مَّجِيْدٌ")],"The minimum is “Allāhumma ṣalli ʿalā Muḥammad”.");
fact(17,"What is the status of sending salawāt upon the Prophet ﷺ in the last sitting?","Rukn",["Wājib","Sunnah","Makrūh"],"It is a rukn of Salah.");
fact(18,"What does making duʿāʾ for worldly enjoyments, such as a big house, do to the prayer?","It invalidates it",["It is disliked only","It is recommended","Nothing"],"Duʿāʾ for worldly enjoyments in Salah invalidates the prayer.");
fact(19,"Asking in Salah for halāl provisions and good health is…","Permissible",["Invalidating","Disliked","Obligatory"],"General blessings of the dunyā such as halāl provisions and good health are permissible.");
fact(20,"How many taslīms are a rukn in an obligatory prayer?","Two",["One","Three","None"],"Saying it twice is a rukn in an obligatory prayer.");
fact(21,"In a nafl prayer, how many taslīms are a rukn?","One (the second is recommended)",["Two","Three","None"],"Once is the rukn in a nafl prayer, and then the second is recommended.");
fact(22,"What happens if a letter is dropped from the taslīm?","It invalidates it",["Nothing, if unintentional only","It is only disliked","It is recommended"],"Dropping, changing or adding a letter invalidates the taslīm.");
fact(23,"Adding “wa barakātuh” to the taslīm is…","Permissible, though leaving it off is better",["Invalidating","Obligatory","Disliked and invalidating"],"It is permissible to add, though leaving it off is better.");
fact(24,"What is a condition for the taslīm?","You must be sitting down",["You must be standing","You must raise your hands","You must say it aloud"],"It is conditioned that the person be sitting down for the taslīm.");
fact(25,"How do you turn while saying the taslīm?","Right first, then left, with more turn to the left",["Left first, then right","Equally both sides","Only to the right"],"Turn right first then left, and when turning to the left it should be more than to the right.");
fact(26,"What is different about a woman’s sujūd?","She does not spread out her limbs",["She does not say the tasbīḥ","She prostrates once","She stays standing"],"Otherwise her prayer is exactly like a man’s.");
fact(27,"How does a woman sit?","Both feet to the right side on the ground (preferred), or cross-legged",["Same as a man in tawarruk","On her heels only","Left foot out, right foot upright"],"Both feet to the right side while sitting on the ground, or cross-legged.");
fact(28,"What is the first dhikr recommended after Salah?","Astaghfirullāh, three times",["Subḥānallāh, 33 times","Āyatul Kursī","Lā ilāha illallāh, once"],"Istighfār three times, then “Allāhumma antas-salām…”.");
fact(29,"How many times do you say each of subḥānallāh, alḥamdulillāh and Allāhu akbar after Salah?","33 each",["10 each","25 each","100 each"],"They are grouped together, thirty-three times each.");
fact(30,"With what are the thirty-three counted?","The fingers of the right hand",["The fingers of the left hand","A counter only","Both hands"],"It is recommended to count them with the fingers of the right hand.");
fact(31,"What should the Imam do after Salah when women are present?","Wait for them to leave before turning to face the congregation",["Turn at once","Leave immediately","Make duʿāʾ aloud"],"He turns round unless women are present, in which case he waits for them to leave.");
fact(32,"Which surahs and verse are recommended after Salah, once each?","Al-Ikhlās, al-Falaq, an-Nās and Āyatul Kursī",["Al-Fātiḥa and al-Baqarah","Yā-Sīn and al-Mulk","Al-Kāfirūn and al-Kawthar"],"Al-Ikhlās, al-Falaq, an-Nās and Āyatul Kursī, one time each.");
fact(33,"What is al-tamaʾnīnah?","Staying still for at least a moment after completing every movement",["Reciting slowly","Praying in a quiet place","Closing the eyes"],"Stillness after each movement, for example after going into rukūʿ.");
fact(34,"Qiyām is a rukn in…","Obligatory prayers",["All prayers without exception","Only Jumuʿah","Only nafl prayers"],"The document notes qiyām is a rukn in obligatory prayers.");
fact(35,"Reciting al-Fātiḥa is a rukn for…","Everyone other than the maʾmūm",["Only the Imam","Everyone including the maʾmūm","Only the one praying alone"],"It is a rukn for other than the maʾmūm.");
fact(36,"When is repeating al-Fātiḥa permitted, though otherwise disliked?","When necessary, such as when it was read incorrectly the first time",["Whenever you feel like it","In every rakʿah","Never"],"Repeating is disliked unless necessary.");
fact(37,"What if someone leans so heavily on something that they would fall without it?","The Salah is not valid, as they are not considered to be standing",["Disliked but valid","Perfectly fine","Valid only in nafl"],"Heavy leaning means they are not considered standing, so the Salah is not valid.");
fact(38,"Praying while needing the bathroom or while hungry is…","Disliked, as it prevents complete concentration",["Invalidating","Recommended","Obligatory"],"Praying in a state which prevents complete concentration is disliked.");
fact(39,"Speaking invalidates Salah when…","Two distinct letters are uttered",["Any single letter is uttered","Only a full sentence is said","Only if it is loud"],"Two distinct letters invalidate it. Likewise other noises, except when excused.");
fact(40,"Eating or drinking intentionally…","Invalidates Salah, though a small drink is permissible in nafl",["Is disliked only","Is permissible in obligatory prayers","Is recommended"],"A small drink in nafl prayers is permissible.");
fact(41,"Najāsah gets on your clothes during Salah. When does it invalidate the prayer?","If it is not removed immediately",["Always, at once","Never","Only if it is on the floor"],"Najāsah on the body, clothes or place of prayer invalidates if not removed immediately.");
fact(42,"When does unintentional uncovering of the ʿawrah invalidate Salah?","When the uncovered amount is a lot and continues for a relatively long time",["Always","Never","Only for women"],"Intentional uncovering invalidates unrestrictedly. Unintentional only in that case.");

function prep(q){
  var s={checked:false,correct:false};
  if(q.type==='mcq'){s.opts=q.opts.map(function(t,i){return {t:t,ok:i===q.a}});if(!q.fixed)s.opts=shuffle(s.opts);s.picked=-1}
  if(q.type==='set'){s.pool=shuffle(q.pool);s.sel={}}
  if(q.type==='order'){s.pool=shuffle(q.items.map(function(t,i){return {t:t,id:i}}));s.ans=[]}
  if(q.type==='match'){s.rights=shuffle(q.pairs.map(function(p,i){return i}));s.pairs={};s.selL=null}
  return s;
}

    if(q.type==='set'){var miss=q.ok.filter(function(t){return !st.sel[t]}),wrong=Object.keys(st.sel).filter(function(t){return q.ok.indexOf(t)<0});
      why=st.correct?'Every item is right.':(miss.length?'Missed: '+miss.length+' (dashed). ':'')+(wrong.length?'Wrongly chosen: '+wrong.length+' (red).':'');}
    if(q.type==='order')why=st.correct?'That is the right order.':'Correct order: '+(q.full?AR(q.full):q.items.map(function(t,i){return (i+1)+'. '+t}).join(' · '));
    if(q.type==='match')why=st.correct?'All pairs are right.':'Pairs marked in red are wrong. The right matches: '+q.pairs.map(function(p){return p[0]+' → '+p[1]}).join('; ');
    h+='<div class="fb '+(st.correct?'good':'bad')+'"><b>'+(st.correct?'Correct':'Not quite')+'</b>'+why+'</div>';
    h+='<div class="row" style="margin-top:14px"><button class="btn primary" data-act="next">'+(Q.i+1<Q.qs.length?'Next question':'See results')+'</button></div>';
  }
  h+='</div>';
  return h;
}
function summaryView(){
  var Q=S.quiz,pct=Math.round(Q.score/Q.qs.length*100);
  var msg=pct>=90?'Excellent. This is close to by heart.':pct>=70?'Solid. A few weak spots remain.':pct>=50?'Getting there. Go back to Learn for the missed items.':'Keep going. Revisit the steps, then try a shorter round.';
  var h='<h1>Results</h1><div class="score">'+Q.score+'<span style="font-size:28px;color:var(--muted)"> / '+Q.qs.length+'</span></div><p class="lede">'+pct+'%. '+msg+'</p>';
  if(Q.missed.length){
    h+='<h3>Missed</h3>';
    Q.missed.forEach(function(q){
      var a='';
      if(q.type==='mcq')a=q.why;
      if(q.type==='set')a='Correct set: '+q.ok.join('; ');
      if(q.type==='order')a=q.full?AR(q.full):q.items.join(' → ');
      if(q.type==='match')a=q.pairs.map(function(p){return p[0]+' → '+p[1]}).join('; ');
      h+='<div class="miss-item">'+q.q+'<div class="meta" style="margin-top:6px">'+a+'</div></div>';
    });
  }
  h+='<div class="row" style="margin-top:24px"><button class="btn primary" data-act="qstart" data-m="'+Q.mode+'">Go again</button><button class="btn" data-act="qquit">All quizzes</button></div>';
  return h;
}
function progressView(){
  var syncNote = currentKhateebUser 
    ? '<span style="display:inline-flex;align-items:center;gap:6px;color:var(--good);font-weight:600;"><svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" fill="none" stroke-width="2.5"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg> Synced to Khateeb Training Portal as ' + (currentKhateebUser.displayName || currentKhateebUser.email) + ' (Tracked by Senior Khateebs)</span>' 
    : '<span>Saved in this browser only. <a href="khateeb.html" style="color:var(--accent);font-weight:600;margin-left:6px;text-decoration:underline;">Khateeb Login to Sync &rarr;</a></span>';

  var h='<h1>Progress</h1><div style="background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 14px;margin-bottom:20px;font-size:14px;line-height:1.4;">' + syncNote + '</div>';
  var n=Object.keys(store.d.learned).length,kn=RECS.filter(function(r){return store.d.known[r.id]}).length;
  h+='<h3>Learning</h3>'+bar('Steps learned',n,STEPS.length)+bar('Recitations known',kn,RECS.length);
  h+='<h3>Quiz accuracy</h3>';
  var any=false;
  Object.keys(KINDS).forEach(function(k){var s=store.d.stats[k];if(s&&(s.r+s.w)){any=true;h+=bar(KINDS[k][0],s.r,s.r+s.w,true)}});
  if(!any)h+='<p class="meta">No quiz answers yet.</p>';
  h+='<h3>Mistakes to review</h3><p>'+Object.keys(store.d.missed).length+' questions are waiting.</p>';
  h+='<div class="row" style="margin-top:24px" id="resetRow"><button class="btn" data-act="reset1">Reset all progress</button></div>';
  return h;
}
function bar(label,a,b,pctOnly){var p=b?Math.round(a/b*100):0;return '<div class="bar-row"><span>'+label+'</span><div class="prog"><i style="width:'+p+'%"></i></div><span class="meta">'+(pctOnly?p+'%':a+'/'+b)+'</span></div>'}

var VIEWS={learn:learnView,memorise:memView,quiz:quizView,progress:progressView};
function render(keepScroll){
  var y=window.scrollY;
  $('#app').innerHTML=VIEWS[S.tab]();
  var b=document.querySelectorAll('#nav button');
  for(var i=0;i<b.length;i++)b[i].setAttribute('aria-current',String(b[i].dataset.t===S.tab));
  if(keepScroll)window.scrollTo(0,y);else window.scrollTo(0,0);
}

/* ---------- quiz logic ---------- */
function startQuiz(mode){
  var pool;
  if(mode==='exam'){
    var buckets=Object.keys(KINDS).map(function(k){return shuffle(POOL.filter(function(q){return q.kind===k}))});
    pool=[];var i=0;while(pool.length<25){var b=buckets[i%buckets.length];if(b.length)pool.push(b.shift());i++;if(i>400)break}
    pool=shuffle(pool);
  }else if(mode==='mistakes'){
    pool=shuffle(POOL.filter(function(q){return store.d.missed[q.key]})).slice(0,15);
  }else pool=shuffle(POOL.filter(function(q){return q.kind===mode})).slice(0,10);
  if(!pool.length)return;
  S.quiz={mode:mode,qs:pool,i:0,score:0,missed:[],done:false,st:prep(pool[0])};
  render();
}
function finishQ(q,ok){
  var Q=S.quiz,st=Q.st;st.checked=true;st.correct=ok;
  if(ok)Q.score++;else Q.missed.push(q);
  var s=store.d.stats[q.kind]||(store.d.stats[q.kind]={r:0,w:0});
  if(ok)s.r++;else s.w++;
  if(ok){if(store.d.missed[q.key]){store.d.missed[q.key]--;if(store.d.missed[q.key]<=0)delete store.d.missed[q.key]}}
  else store.d.missed[q.key]=2;
  store.save();render(true);
}

/* ---------- actions ---------- */
var A={
 tab:function(d){S.tab=d.t;store.d.tab=d.t;store.save();if(d.t==='quiz'&&S.quiz&&S.quiz.done)S.quiz=null;render()},
 learned:function(d,el){
   var on=!store.d.learned[d.id];if(on)store.d.learned[d.id]=1;else delete store.d.learned[d.id];store.save();
   el.textContent=on?'Mark as not learned':'Mark as learned';
   var t=document.getElementById('tag-'+d.id);t.textContent=on?'Learned':d.tag;t.className='tag '+(on?'done':d.cls);
   document.getElementById('lcount').textContent=Object.keys(store.d.learned).length+' of '+STEPS.length+' steps marked as learned';
 },
 mmode:function(d){S.mem.mode=d.m;render(true)},
 mdir:function(d){S.mem.dir=d.d;S.mem.shown=false;render(true)},
 flip:function(){S.mem.shown=!S.mem.shown;render(true)},
 gotit:function(){var m=S.mem,id=m.queue.shift();store.d.known[id]=1;store.save();m.shown=false;render(true)},
 again:function(){var m=S.mem,id=m.queue.shift();m.queue.push(id);m.shown=false;render(true)},
 cardreset:function(){store.d.known={};store.save();S.mem.queue=null;S.mem.shown=false;render(true)},
 mlist:function(d){S.mem.list=d.k;render(true)},
 rv:function(d){var r=S.mem.rev[S.mem.list]||(S.mem.rev[S.mem.list]={});if(r[d.i])delete r[d.i];else r[d.i]=1;render(true)},
 rvnext:function(){var L=LISTS[S.mem.list],r=S.mem.rev[S.mem.list]||(S.mem.rev[S.mem.list]={});for(var i=0;i<L.a.length;i++){if(!r[i]){r[i]=1;break}}render(true)},
 rvall:function(){var L=LISTS[S.mem.list],r={};L.a.forEach(function(x,i){r[i]=1});S.mem.rev[S.mem.list]=r;render(true)},
 rvhide:function(){S.mem.rev[S.mem.list]={};render(true)},
 qstart:function(d){startQuiz(d.m)},
 qquit:function(){S.quiz=null;render()},
 pick:function(d){var Q=S.quiz,q=Q.qs[Q.i],st=Q.st;if(st.checked)return;st.picked=+d.i;finishQ(q,st.opts[st.picked].ok)},
 tog:function(d){var st=S.quiz.st;if(st.checked)return;var t=st.pool[+d.i];if(st.sel[t])delete st.sel[t];else st.sel[t]=1;render(true)},
 oadd:function(d){var st=S.quiz.st;if(st.checked)return;st.ans.push(st.pool.splice(+d.i,1)[0]);render(true)},
 odel:function(d){var st=S.quiz.st;if(st.checked)return;st.pool.push(st.ans.splice(+d.i,1)[0]);render(true)},
 oreset:function(){var st=S.quiz.st;st.pool=st.pool.concat(st.ans);st.ans=[];render(true)},
 ml:function(d){var st=S.quiz.st;if(st.checked)return;st.selL=+d.i;render(true)},
 mr:function(d){var st=S.quiz.st;if(st.checked||st.selL===null)return;var r=+d.i;for(var k in st.pairs){if(st.pairs[k]===r)delete st.pairs[k]}st.pairs[st.selL]=r;st.selL=null;render(true)},
 check:function(){
   var Q=S.quiz,q=Q.qs[Q.i],st=Q.st,ok=false;
   if(q.type==='set'){var sel=Object.keys(st.sel);ok=sel.length===q.ok.length&&sel.every(function(t){return q.ok.indexOf(t)>=0})}
   if(q.type==='order'){ok=st.ans.length===q.items.length&&st.ans.every(function(o,i){return o.t===q.items[i]})}
   if(q.type==='match'){ok=q.pairs.every(function(p,i){return st.pairs[i]===i})}
   finishQ(q,ok);
 },
 next:function(){var Q=S.quiz;if(Q.i+1>=Q.qs.length){Q.done=true;render();return}Q.i++;Q.st=prep(Q.qs[Q.i]);render()},
 reset1:function(){var r=document.getElementById('resetRow');r.innerHTML='<span class="meta">This clears everything saved here.</span><button class="btn primary" data-act="reset2">Yes, reset</button><button class="btn" data-act="reset0">Cancel</button>'},
 reset0:function(){render(true)},
 reset2:function(){store.d={learned:{},known:{},stats:{},missed:{},tab:'progress'};store.save();S.mem.queue=null;S.quiz=null;render()}
};
document.addEventListener('click',function(e){
  var t=e.target.closest?e.target.closest('[data-act]'):null;if(!t||t.disabled)return;
  var f=A[t.dataset.act];if(f)f(t.dataset,t);
});
document.addEventListener('keydown',function(e){
  if((e.key==='Enter'||e.key===' ')&&e.target&&e.target.getAttribute&&e.target.getAttribute('role')==='button'){e.preventDefault();e.target.click()}
});
render();

// Init Firebase Auth for Salah Sync
if (window.firebase) {
  try {
    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    firebase.auth().onAuthStateChanged(function(user){
      currentKhateebUser = user;
      var badge = document.getElementById('khateebSyncBadge');
      if (user) {
        if (badge) {
          badge.style.display = 'inline-flex';
          badge.style.background = 'var(--accent-soft)';
          badge.style.color = 'var(--accent)';
          badge.innerHTML = '🟢 Synced: ' + (user.displayName || user.email.split('@')[0]) + ' · <a href="khateeb.html" style="color:inherit;text-decoration:underline;">Portal</a>';
        }
        firebase.firestore().collection('salah_progress').doc(user.uid).get().then(function(doc){
          if (doc.exists) {
            var data = doc.data();
            if (data.learnedSteps) {
              for (var k in data.learnedSteps) store.d.learned[k] = true;
            }
            if (data.knownRecitations) {
              for (var r in data.knownRecitations) store.d.known[r] = true;
            }
            if (data.quizStats) {
              for (var q in data.quizStats) store.d.stats[q] = data.quizStats[q];
            }
            try{localStorage.setItem('salah-by-heart-v1',JSON.stringify(store.d))}catch(e){}
            render(true);
          } else {
            syncToFirebase();
          }
        }).catch(function(e){ console.warn(e); });
      } else {
        if (badge) {
          badge.style.display = 'inline-flex';
          badge.style.background = 'var(--line)';
          badge.style.color = 'var(--muted)';
          badge.innerHTML = '👤 Guest · <a href="khateeb.html" style="color:inherit;text-decoration:underline;">Khateeb Sync</a>';
        }
      }
    });
  } catch(e) { console.warn(e); }
}
})();
</script>
