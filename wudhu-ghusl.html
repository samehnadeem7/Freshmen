<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Wudhu & Ghusl | VNIT Guide</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600&family=Newsreader:opsz,wght@6..72,400;6..72,500&display=swap">
  <style>
    :root{--bg:#f5f6f3;--surface:#fff;--ink:#14201c;--muted:#5e6b66;--line:#dce1dc;--accent:#1f5d4a;--accent-ink:#fff;--soft:#e3eee9;--good:#23704a;--good-soft:#e1f1e7;--bad:#ae3b2b;--bad-soft:#f7e3df;--display:Newsreader,Georgia,serif;--body:"Hanken Grotesk",system-ui,sans-serif}
    @media(prefers-color-scheme:dark){:root{--bg:#0e1412;--surface:#151d1a;--ink:#e8eeea;--muted:#93a29b;--line:#263230;--accent:#7fd1af;--accent-ink:#0e1412;--soft:#1a2a24;--good:#6fcf97;--good-soft:#16291f;--bad:#f09282;--bad-soft:#2e1b18}}
    *{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 var(--body);padding:0 16px 64px}.wrap{max-width:720px;margin:auto}.bar{position:sticky;top:0;z-index:2;background:var(--bg);border-bottom:1px solid var(--line);margin:0 -16px}.bar .wrap{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 16px;flex-wrap:wrap}.brand{font:20px var(--display);display:flex;gap:10px;align-items:center}.back{font:600 12px var(--body);letter-spacing:.05em;text-transform:uppercase;color:var(--accent);text-decoration:none;border:1px solid var(--line);border-radius:6px;padding:4px 8px;background:var(--surface)}nav{display:flex;gap:2px}button{font-family:inherit;color:inherit}:focus-visible{outline:2px solid var(--accent);outline-offset:2px}nav button{border:0;background:none;color:var(--muted);padding:8px 10px;border-radius:8px;cursor:pointer;font-size:14px}nav button[aria-current=true]{background:var(--soft);color:var(--accent)}h1,h2{font-family:var(--display);font-weight:400;line-height:1.1}h1{font-size:clamp(34px,7vw,52px);margin:36px 0 10px}h2{font-size:27px;margin:38px 0 12px}h3{font-size:12px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin:24px 0 8px}.lede,.meta{color:var(--muted)}.lede{font-size:18px;max-width:55ch}.note{border-left:2px solid var(--accent);padding:4px 0 4px 14px;color:var(--muted);font-size:15px;margin:20px 0}.counts{display:grid;grid-template-columns:repeat(4,1fr);border-block:1px solid var(--line);margin:28px 0}.counts div{text-align:center;padding:13px 6px;border-left:1px solid var(--line)}.counts div:first-child{border:0}.counts b{display:block;font:34px/1 var(--display);color:var(--accent)}.counts span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.07em}.step{border-top:1px solid var(--line)}.step:last-of-type{border-bottom:1px solid var(--line)}summary{display:flex;align-items:center;gap:12px;padding:16px 2px;cursor:pointer;list-style:none}summary::-webkit-details-marker{display:none}.idx{font:22px var(--display);color:var(--muted);width:28px}.title{flex:1;font-weight:500}.tag{font-size:11px;letter-spacing:.08em;text-transform:uppercase;border:1px solid var(--line);border-radius:99px;padding:3px 8px;color:var(--muted)}.tag.required{color:var(--accent);border-color:var(--accent)}.tag.done{background:var(--good-soft);border-color:transparent;color:var(--good)}.step-body{padding:0 2px 22px 42px}.step-body ul{margin:0 0 14px;padding-left:18px}.step-body li{margin:0 0 7px}.btn{border:1px solid var(--line);background:var(--surface);padding:9px 14px;border-radius:9px;cursor:pointer;font-size:14px}.btn:hover{border-color:var(--accent)}.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px;margin:16px 0}.flash{min-height:230px;display:flex;flex-direction:column;justify-content:center;text-align:center;cursor:pointer}.small{font-size:12px;color:var(--muted);letter-spacing:.1em;text-transform:uppercase}.flash .name,.question{font:27px/1.25 var(--display);margin:9px 0}.progress{height:5px;background:var(--line);border-radius:5px;overflow:hidden;margin:10px 0}.progress i{display:block;height:100%;background:var(--accent)}.choices{display:grid;gap:8px}.choice{text-align:left;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:12px;cursor:pointer;font:500 15px/1.4 var(--body)}.choice:hover:not(:disabled){border-color:var(--accent)}.choice.ok{background:var(--good-soft);border-color:var(--good)}.choice.no{background:var(--bad-soft);border-color:var(--bad)}.feedback{padding:13px;border-radius:10px;margin-top:14px}.feedback.good{background:var(--good-soft)}.feedback.bad{background:var(--bad-soft)}.list{padding-left:20px}.list li{margin-bottom:6px}@media(max-width:520px){.bar .wrap{justify-content:center}.brand{width:100%;justify-content:center}.step-body{padding-left:2px}.counts b{font-size:27px}}
  </style>
</head>
<body>
  <header class="bar"><div class="wrap"><div class="brand"><a class="back" href="index.html">← Guide</a><span>Wudhu & Ghusl</span></div><nav aria-label="Sections"><button data-tab="learn">Learn</button><button data-tab="memorise">Memorise</button><button data-tab="quiz">Quiz</button><button data-tab="progress">Progress</button></nav></div></header>
  <main class="wrap" id="app"></main>
  <script>
  (function(){"use strict";
    var $=function(s){return document.querySelector(s)}, store={d:{learned:{},known:{},answers:0,correct:0,tab:"learn"},load:function(){try{var x=JSON.parse(localStorage.getItem("purification-guide-v1"));if(x)Object.assign(this.d,x)}catch(e){}},save:function(){localStorage.setItem("purification-guide-v1",JSON.stringify(this.d))}};store.load();
    var WUDHU=[
      ["Before you begin","Condition",["Be Muslim, sane, and able to understand what you are doing.","Make the intention in your heart to lift minor impurity or make prayer permissible. Do not need to say it aloud.","Use pure, purifying water. Remove nail polish, paint, thick grease, or anything that blocks water.","If needed, clean yourself after relieving yourself. Wait until urine, menstrual bleeding, or post-partum bleeding has ended."]],
      ["Say Bismillah","Required",["Say Bismillah before starting. If you deliberately leave it, repeat the Wudhu. Forgetting is excused; continue when you remember.","Facing the Qiblah is good if it is easy, but it is not required."]],
      ["Wash both hands","Sunnah",["Wash both hands to the wrists three times, right then left.","This wash is required when waking from a night sleep. Small dirt under nails is excused, but remove anything that blocks water."]],
      ["Rinse mouth and nose","Required",["Rinse the mouth and nose three times. Make water reach the mouth and nostrils.","It is best to use one right-hand scoop for both, and use the left hand to expel water from the nose."]],
      ["Wash the face","Required",["Wash from the usual hairline to the chin, and ear to ear. Do this three times.","Wash the whole beard. If it is thin, water must reach the skin beneath it."]],
      ["Wash arms to the elbows","Required",["Wash the right hand, forearm, and elbow three times, then the left. Include nails and elbows.","It is best to rub the water in and wash a little beyond the elbow."]],
      ["Wipe head and ears","Required",["With fresh water, wipe the whole head once: front to back, then return.","Wipe inside the ears with index fingers and outside with thumbs."]],
      ["Wash feet to the ankles","Required",["Wash the right foot including the ankle three times, then the left.","It is best to rub between the toes, starting at the right little toe with the left little finger."]],
      ["Finish in order and without a long gap","Required",["Keep this order: face, arms, head, feet. Mouth and nose are part of washing the face.","Do each part continuously. Do not leave a long break that lets the previous limb dry in normal conditions.","After Wudhu, it is recommended to say: Ashhadu an la ilaha ill-Allah wahdahu la sharika lah, wa ashhadu anna Muhammadan abduhu wa rasuluh."]]
    ];
    var GHUSL=[
      ["When Ghusl is required","When needed",["After sexual intercourse, even without discharge.","After semen is discharged with pleasure.","When menstruation or post-partum bleeding ends.","For a deceased Muslim, except a martyr killed in battle. Ask a teacher about less common cases."]],
      ["The minimum valid Ghusl","Required",["Make the intention in your heart to lift major impurity.","Wash the entire body once, including the mouth and nose.","Make sure water reaches hair roots, skin folds, underarms, between toes, and behind knees. Remove anything that blocks water.","This is enough. You do not need a separate Wudhu when the Ghusl is complete and nothing has broken it."]],
      ["The complete Sunnah Ghusl","Sunnah",["Intend, say Bismillah, and wash your hands three times.","Wash away impurity from the private area.","Make a complete Wudhu. You may delay washing the feet until the end if standing where water collects.","Pour water over the head three times, working it through to the roots.","Wash the whole body, right side then left, rubbing water over it."]]
    ];
    var BREAKS=["Anything that exits from the front or back passage, such as urine, stool, wind, or discharge.","A large amount of vomit or blood, according to the commonly taught Hanbali view.","Loss of consciousness, except light dozing while standing or sitting.","Washing a deceased person or part of one.","Eating camel meat.","Touching a human private part or anus directly with the hand.","Apostasy."];
    var CARDS=[
      {q:"What are the four washing or wiping obligations of Wudhu?",a:"Face including mouth and nose; arms including elbows; whole head including ears; feet including ankles."},
      {q:"What makes the simple form of Ghusl valid?",a:"Intention, then washing the entire body once, including mouth and nose."},
      {q:"What order must Wudhu follow?",a:"Face, arms, head, then feet."},
      {q:"Name three things that can break Wudhu.",a:"For example: something exiting the passages, loss of consciousness, camel meat, direct private-part touch, or washing a deceased person."},
      {q:"Does a person need a separate Wudhu after a complete Ghusl?",a:"No, if the Ghusl was complete and nothing broke their Wudhu during it."}
    ];
    var QUIZ=[
      {q:"Which is required for Wudhu?",o:["Wiping only part of the head","Washing the face, including mouth and nose","Washing each limb exactly three times"],a:1,e:"The required wash is once; three times is Sunnah. The whole face includes mouth and nose."},
      {q:"What must be removed before Wudhu or Ghusl?",o:["Anything that blocks water from reaching skin or nails","All natural oil from the skin","Every trace of ordinary dirt"],a:0,e:"Remove a barrier such as nail polish, paint, or thick grease. Ordinary clean dirt is different."},
      {q:"Which of these breaks Wudhu in this guide?",o:["Eating camel meat","Drinking camel milk","Touching a camel"],a:0,e:"Eating camel meat breaks Wudhu; its milk and stock do not."},
      {q:"What is enough for a valid Ghusl?",o:["A complete Wudhu only","Washing all of the body once with intention, including mouth and nose","Washing the body three times in a fixed order"],a:1,e:"The minimum is intention and water reaching the entire body, mouth, and nose."},
      {q:"What should you do if you deliberately omit Bismillah before Wudhu?",o:["Continue; it is only recommended","Repeat the Wudhu","Only wash the hands again"],a:1,e:"In this Hanbali-oriented guide, deliberately omitting it means the Wudhu is repeated; forgetting is excused."},
      {q:"Which is not required for valid Wudhu?",o:["Doing the obligatory parts in order","Leaving a long gap between limbs","Washing every required limb three times"],a:2,e:"One complete wash is enough. Three washes are the preferred Sunnah."}
    ];
    var S={tab:store.d.tab,card:0,shown:false,quiz:null};
    function esc(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}
    function list(a){return "<ul>"+a.map(function(x){return "<li>"+x+"</li>"}).join("")+"</ul>"}
    function steps(group,prefix){return group.map(function(x,i){var id=prefix+i,d=store.d.learned[id],tag=x[1]==="Required"?"required":"";return '<details class="step"><summary><span class="idx">'+(i+1)+'</span><span class="title">'+x[0]+'</span><span class="tag '+(d?"done":tag)+'">'+(d?"Learned":x[1])+'</span></summary><div class="step-body">'+list(x[2])+'<button class="btn" data-act="learn" data-id="'+id+'">'+(d?"Mark as not learned":"Mark as learned")+'</button></div></details>'}).join("")}
    function learn(){var n=Object.keys(store.d.learned).length;return '<h1>Purify simply, then pray.</h1><p class="lede">A clear guide to Wudhu and Ghusl: what is required, what is recommended, and what breaks Wudhu.</p><div class="counts"><div><b>6</b><span>Wudhu duties</span></div><div><b>8</b><span>Conditions</span></div><div><b>7</b><span>Breakers</span></div><div><b>2</b><span>Ghusl forms</span></div></div><h2>Wudhu, step by step</h2><p class="meta">'+n+' of '+(WUDHU.length+GHUSL.length)+' sections marked learned</p>'+steps(WUDHU,"w")+'<h2>What breaks Wudhu</h2><div class="card">'+list(BREAKS)+'</div><h2>Ghusl</h2><p class="lede">Ghusl is the full purification needed after major impurity.</p>'+steps(GHUSL,"g")+'<h2>Quick answers</h2><div class="card"><h3>Does Ghusl include Wudhu?</h3><p>Yes, a complete Ghusl with intention is sufficient for both major and minor impurity, as long as nothing breaks Wudhu during it.</p><h3>Can women make Wudhu and Ghusl the same way?</h3><p>Yes. Water must reach the scalp and skin. Braids do not have to be undone if water reaches the roots.</p><h3>What if I have a wound or cannot use water?</h3><p>Do what you can safely and ask a qualified local teacher about washing over a dressing or tayammum.</p></div><p class="meta">Core evidence: Quran 5:6; the Wudhu of Uthman in Sahih Muslim; and Hanbali fiqh summaries such as Zad al-Mustaqni.</p>'}
    function memorise(){var c=CARDS[S.card],known=Object.keys(store.d.known).length;return '<h1>Memorise</h1><p class="lede">Try to answer before revealing the card.</p><div class="progress"><i style="width:'+(known/CARDS.length*100)+'%"></i></div><p class="meta">'+known+' of '+CARDS.length+' cards known</p><div class="card flash" data-act="reveal"><div class="small">'+(S.shown?"Answer":"Recall this")+'</div><div class="name">'+esc(S.shown?c.a:c.q)+'</div><p class="meta">'+(S.shown?"Tap to see the question":"Tap to reveal")+'</p></div><div class="row"><button class="btn" data-act="prev">Previous</button><button class="btn" data-act="next">Next</button>'+ (S.shown?'<button class="btn primary" data-act="known">Got it</button>':'')+'</div>'}
    function quiz(){if(!S.quiz)return '<h1>Quiz</h1><p class="lede">Check the essentials before the next prayer.</p><div class="card"><p class="question">Six quick questions on Wudhu and Ghusl.</p><button class="btn primary" data-act="start">Start quiz</button></div>';var q=QUIZ[S.quiz.i];if(S.quiz.done){var p=Math.round(S.quiz.score/QUIZ.length*100);return '<h1>Quiz complete</h1><div class="card"><div class="small">Your score</div><div class="question">'+S.quiz.score+' / '+QUIZ.length+' ('+p+'%)</div><p class="meta">Review the Learn tab for any answer you missed.</p><button class="btn primary" data-act="start">Try again</button></div>'}var h='<h1>Quiz</h1><p class="meta">Question '+(S.quiz.i+1)+' of '+QUIZ.length+'</p><div class="card"><div class="question">'+q.q+'</div><div class="choices">';q.o.forEach(function(o,i){var cls="";if(S.quiz.checked)cls=i===q.a?" ok":i===S.quiz.pick?" no":"";h+='<button class="choice'+cls+'" data-act="answer" data-i="'+i+'" '+(S.quiz.checked?"disabled":"")+'>'+o+'</button>'});h+='</div>';if(S.quiz.checked)h+='<div class="feedback '+(S.quiz.pick===q.a?"good":"bad")+'"><b>'+(S.quiz.pick===q.a?"Correct.":"Not quite.")+'</b> '+q.e+'</div><button class="btn primary" style="margin-top:14px" data-act="continue">'+(S.quiz.i+1===QUIZ.length?"See result":"Next question")+'</button>';return h+'</div>'}
    function progress(){var learned=Object.keys(store.d.learned).length,known=Object.keys(store.d.known).length,pct=store.d.answers?Math.round(store.d.correct/store.d.answers*100):0;return '<h1>Your progress</h1><p class="lede">Progress stays only in this browser.</p><div class="card"><h3>Learn</h3><div class="question">'+learned+' / '+(WUDHU.length+GHUSL.length)+'</div><div class="progress"><i style="width:'+(learned/(WUDHU.length+GHUSL.length)*100)+'%"></i></div><h3>Memorise</h3><div class="question">'+known+' / '+CARDS.length+'</div><div class="progress"><i style="width:'+(known/CARDS.length*100)+'%"></i></div><h3>Quiz accuracy</h3><div class="question">'+pct+'%</div><p class="meta">'+store.d.correct+' correct from '+store.d.answers+' answers</p><button class="btn" data-act="reset">Reset progress</button></div>'}
    function render(){store.d.tab=S.tab;store.save();var f={learn:learn,memorise:memorise,quiz:quiz,progress:progress}[S.tab];$("#app").innerHTML=f();document.querySelectorAll("[data-tab]").forEach(function(b){b.setAttribute("aria-current",b.dataset.tab===S.tab?"true":"false")})}
    document.addEventListener("click",function(e){var b=e.target.closest("[data-act],[data-tab]");if(!b)return;if(b.dataset.tab){S.tab=b.dataset.tab;render();return}var a=b.dataset.act;if(a==="learn"){var id=b.dataset.id;store.d.learned[id]?delete store.d.learned[id]:store.d.learned[id]=1;render()}if(a==="reveal"){S.shown=!S.shown;render()}if(a==="next"||a==="prev"){S.card=(S.card+(a==="next"?1:CARDS.length-1))%CARDS.length;S.shown=false;render()}if(a==="known"){store.d.known[S.card]=1;S.shown=false;render()}if(a==="start"){S.quiz={i:0,score:0,checked:false,pick:null,done:false};render()}if(a==="answer"&&!S.quiz.checked){S.quiz.pick=+b.dataset.i;S.quiz.checked=true;store.d.answers++;if(S.quiz.pick===QUIZ[S.quiz.i].a){S.quiz.score++;store.d.correct++}store.save();render()}if(a==="continue"){if(++S.quiz.i===QUIZ.length)S.quiz.done=true;else{S.quiz.checked=false;S.quiz.pick=null}render()}if(a==="reset"){store.d={learned:{},known:{},answers:0,correct:0,tab:"progress"};store.save();S.card=0;S.quiz=null;render()}});render();
  })();
  </script>
</body>
